name: Verify site build

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Configure GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow || true
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Report content and Pages status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "--- Publication links on the publications page ---"
          grep -o 'href="[^"]*/publication/[^"]*"' _site/publications/index.html | sort -u
          echo "--- About page section headings ---"
          grep -o '<h2 id="[^"]*"' _site/index.html
          echo "--- Publications mentioned on the About page ---"
          for title in "SynLogic" "Perception Bottleneck" "Universal Truthfulness" "In-Context Sharpness" "C-Eval" "Composing Parameter-Efficient"; do
            printf '%s: ' "$title"
            grep -c "$title" _site/index.html
          done
          echo "--- Contact details on the About page ---"
          grep -o 'jliugi@connect.ust.hk\|Vicent0205\|junteng88716710\|tbK9jl4AAAAJ' _site/index.html | sort -u
          echo "--- GitHub Pages status ---"
          gh api "repos/${GITHUB_REPOSITORY}/pages" || echo "Pages is not enabled"